name: Skeleton
description: Replacement for the_build_utility
type: 'Administration'

install:
  - admin_toolbar
  - admin_toolbar_tools
  - config_ignore
  - config_split
  - config_split
  - devel
  - workbench
  - workbench_tabs

config:
  strict: false
  actions:
    user.settings:
      simpleConfigUpdate:
        register: admin_only
    system.date:
        simpleConfigUpdate:
          country.default: US
          timezone.default: 'America/Chicago'
          timezone.user.configurable: FALSE
    field.storage.node.comment:
      disable: []
    field.field.node.article.comment:
      disable: []


